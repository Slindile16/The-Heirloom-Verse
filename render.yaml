services:
  - type: web
    name: heirloom-verse-demo
    runtime: static
    buildCommand: cd storefront && npm run check
    staticPublishPath: storefront/dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
